<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aw pattern-gen デモ</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, monospace; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; }
  svg#pattern { width: 100%; height: auto; border-radius: 12px; border: 1px solid #334155; display: block; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; align-items: center; }
  button, select, input { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font: inherit; }
  button:hover { background: #334155; cursor: pointer; }
  #status { font-size: 12px; color: #94a3b8; min-height: 18px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 16px; }
  #list img { width: 100%; border-radius: 8px; border: 1px solid #334155; }
  #aw { font-size: 12px; color: #64748b; margin-top: 24px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>aw pattern-gen デモ</h1>
  <p>ボタン → aw-api（下）→ workflow → SVG 生成 → Pages 更新 → 再描画</p>
  <img id="pattern" alt="pattern" src="/patterns/latest.svg" />
  <div class="controls">
    <button id="gen">生成</button>
    <select id="style">
      <option value="stripes">stripes</option>
      <option value="circles">circles</option>
      <option value="grid">grid</option>
      <option value="waves">waves</option>
      <option value="mosaic">mosaic</option>
    </select>
    <input id="seed" placeholder="seed (空=ランダム)" />
    <label><input type="checkbox" id="poll" checked /> 自動ポーリング</label>
  </div>
  <div id="status">idle</div>
  <div id="list"></div>
  <div id="aw"></div>
</main>
<script src="/script.js"></script>
</body>
</html>
